name: CI and Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: shellcheck auth.sh app_calculator.sh
      - name: Test calculator
        run: |
          output=$(./app_calculator.sh 5 10)
          if [ "$output" != "Сумма: 15" ]; then
            printf 'Тест провален: %s\n' "$output"
            exit 1
          fi
          echo 'Тест успешно пройден!'

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t "my-app:${GITHUB_SHA}" .
      - name: Test Docker container
        run: |
          docker run -d -p 127.0.0.1:8080:8080 --name test_app "my-app:${GITHUB_SHA}"
          trap 'docker rm -f test_app >/dev/null' EXIT
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:8080/

  ansible-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ansible-lint
        run: pipx install ansible-lint
      - name: Validate Ansible playbook
        run: ansible-lint ansible_iac/setup_env.yml

  compose-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose file
        working-directory: monitoring
        run: docker compose config --quiet
